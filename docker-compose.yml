services:
  caddy:
    build:
      context: .
      dockerfile: .docker/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: .
      dockerfile: .docker/php-fpm/Dockerfile
    restart: unless-stopped
    working_dir: /application
    volumes:
      - php-sessions:/var/lib/php/sessions

volumes:
  php-sessions:
